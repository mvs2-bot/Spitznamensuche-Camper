<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Namenssuche für den Camper-Bus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input, textarea { font-size: 16px !important; }

        /* Variable Animation für das Auto, die per JavaScript gesteuert wird */
        @keyframes drive {
            0% { transform: translateX(0px); }
            100% { transform: translateX(var(--travel-distance, 250px)); }
        }
        .animate-car {
            animation: drive var(--anim-duration, 3s) cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between p-3 overflow-hidden selection:bg-emerald-500 selection:text-white">

    <!-- Header / Counter oben -->
    <header class="w-full max-w-md mx-auto flex justify-between items-center py-1 px-1">
        <span class="text-[11px] font-semibold tracking-wider uppercase text-slate-400 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full shadow-sm">
            🚐 Ford Tourneo Connect
        </span>
        <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full text-[11px] font-medium text-emerald-400 shadow-sm">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span id="counterValue">...</span> Vorschläge
        </div>
    </header>

    <!-- Main Content Card -->
    <main class="w-full max-w-md mx-auto my-auto">
        <div class="bg-slate-900/90 backdrop-blur-md rounded-2xl shadow-2xl p-5 border border-slate-800">
            
            <!-- Titel-Bereich -->
            <div class="text-center mb-4">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-2xl mb-1.5 shadow-inner">
                    ⛺
                </div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">Wie soll mein Camper heißen?</h1>
                <p class="text-slate-400 text-xs mt-1 leading-relaxed max-w-xs mx-auto">
                    Campingbox & Dachzelt sind bereit. Welcher Spitzname passt perfekt?
                </p>
            </div>

            <!-- Formular -->
            <form id="nicknameForm" class="space-y-3">
                
                <!-- Namensvorschlag (max. 40 Zeichen) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="nickname" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-300">Dein Namensvorschlag *</label>
                        <span id="count-nickname" class="text-[10px] text-slate-500">0 / 40</span>
                    </div>
                    <input type="text" id="nickname" name="Spitzname" required maxlength="40" oninput="updateCount('nickname', 40)"
                        class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none text-white placeholder-slate-600 text-sm transition"
                        placeholder="z.B. Rollende Festung, Bergbuddy...">
                </div>

                <!-- Name des Vorschlagenden (max. 20 Zeichen) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="author" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-300">Dein Name (optional)</label>
                        <span id="count-author" class="text-[10px] text-slate-500">0 / 20</span>
                    </div>
                    <input type="text" id="author" name="VorgeschlagenVon" maxlength="20" oninput="updateCount('author', 20)"
                        class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none text-white placeholder-slate-600 text-sm transition"
                        placeholder="Wer schlägt das vor?">
                </div>

                <!-- Begründung (max. 200 Zeichen) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="reason" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-300">Warum passt dieser Name? (optional)</label>
                        <span id="count-reason" class="text-[10px] text-slate-500">0 / 200</span>
                    </div>
                    <textarea id="reason" name="Begruendung" rows="2" maxlength="200" oninput="updateCount('reason', 200)"
                        class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none text-white placeholder-slate-600 text-sm transition resize-none"
                        placeholder="Kurze Story oder Begründung..."></textarea>
                </div>

                <!-- ABSENDE-BUTTON -->
                <button type="submit" id="submitBtn"
                    class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold rounded-xl text-sm transition duration-200 shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2">
                    <span>Vorschlag abschicken</span>
                    <span>🚀</span>
                </button>

                <!-- AUTO-LADEBALKEN -->
                <div id="loadingContainer" class="hidden space-y-1.5 pt-1">
                    <div class="flex justify-between text-[11px] text-slate-400 font-medium">
                        <span>Fahre zur Google-Tabelle...</span>
                        <span id="loadingStatus">Unterwegs 🚐</span>
                    </div>
                    <!-- Schiene -->
                    <div id="railTrack" class="w-full h-8 bg-slate-950 rounded-xl overflow-hidden px-2 border border-slate-800 relative flex items-center">
                        <!-- Bewegliches Auto -->
                        <div id="carMover" class="absolute left-2 text-base animate-car">
                            🚐
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </main>

    <!-- Platzhalter unten für perfekte Zentrierung -->
    <div class="h-2"></div>

    <!-- POP-OVER / MODAL -->
    <div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-2xl mb-3">
                🎉
            </div>
            <h2 class="text-lg font-bold text-white">Vielen Dank für deinen Vorschlag!</h2>
            <p class="text-slate-400 text-xs mt-1.5">
                Der Name ist direkt in der Tabelle gelandet.
            </p>
            <button onclick="closeModal()" class="mt-5 w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-xs transition shadow-lg shadow-emerald-900/30">
                Weiteren Vorschlag abgeben
            </button>
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        const sheetApiUrl = 'https://script.google.com/macros/s/AKfycbwNSkbW9kCD4blonxr69zqJekOLBP0S2wSPoSF3s1m4QdL63D70p4njDNBivr3nT50/exec';

        function updateCount(fieldId, max) {
            const field = document.getElementById(fieldId);
            const counter = document.getElementById('count-' + fieldId);
            const currentLength = field.value.length;
            counter.innerText = `${currentLength} / ${max}`;
            if (currentLength >= max) {
                counter.classList.add('text-amber-400');
            } else {
                counter.classList.remove('text-amber-400');
            }
        }

        async function fetchCounter() {
            try {
                let response = await fetch(sheetApiUrl);
                let data = await response.json();
                document.getElementById('counterValue').innerText = data.count;
            } catch (e) {
                document.getElementById('counterValue').innerText = '0';
            }
        }

        fetchCounter();

        const form = document.getElementById('nicknameForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingContainer = document.getElementById('loadingContainer');
        const modal = document.getElementById('successModal');
        const modalContent = document.getElementById('modalContent');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Button verstecken, Ladebalken anzeigen
            submitBtn.classList.add('hidden');
            loadingContainer.classList.remove('hidden');

            // Exakte Fahrstrecke berechnen (Breite der Schiene minus Autobreite)
            const railTrack = document.getElementById('railTrack');
            const carMover = document.getElementById('carMover');
            const distance = railTrack.clientWidth - carMover.clientWidth - 16; 

            // Zufällige Dauer zwischen 2.0 und 4.0 Sekunden generieren (z.B. 2.7s)
            const randomDuration = (Math.random() * 2 + 2).toFixed(2); // Sek.

            // CSS Variablen dynamisch setzen
            carMover.style.setProperty('--travel-distance', distance + 'px');
            carMover.style.setProperty('--anim-duration', randomDuration + 's');

            const formData = {
                "Spitzname": document.getElementById('nickname').value,
                "VorgeschlagenVon": document.getElementById('author').value,
                "Begruendung": document.getElementById('reason').value,
                "Zeitpunkt": new Date().toLocaleString("de-DE", { timeZone: "Europe/Berlin" })
            };

            function showSuccess() {
                loadingContainer.classList.add('hidden');
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                }, 10);
                fetchCounter();
            }

            let requestFinished = false;

            // Daten im Hintergrund abschicken
            fetch(sheetApiUrl, {
                method: 'POST',
                body: JSON.stringify(formData)
            }).then(() => {
                if (!requestFinished) {
                    requestFinished = true;
                    showSuccess();
                }
            }).catch(err => {
                if (!requestFinished) {
                    requestFinished = true;
                    showSuccess();
                }
            });

            // Das Pop-up öffnet sich exakt nach der zufälligen Auto-Fahrzeit (in Millisekunden)
            const timeoutMs = parseFloat(randomDuration) * 1000;
            setTimeout(() => {
                if (!requestFinished) {
                    requestFinished = true;
                    showSuccess();
                }
            }, timeoutMs);
        });

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);

            form.reset();
            document.getElementById('count-nickname').innerText = '0 / 40';
            document.getElementById('count-author').innerText = '0 / 20';
            document.getElementById('count-reason').innerText = '0 / 200';
            
            loadingContainer.classList.add('hidden');
            submitBtn.classList.remove('hidden');
            fetchCounter();
        }
    </script>
</body>
</html>
